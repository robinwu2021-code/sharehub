<text x="56" y="870" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">回调顺序沿用 ai-shop：验签 → 回查通道 → 落库 → 发事件；回查失败返回 FAIL 让通道重推。卡号不进本系统，通道密钥只在 pay 库（KMS）。</text>
