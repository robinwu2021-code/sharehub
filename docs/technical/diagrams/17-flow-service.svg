<text x="56" y="844" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实线：调用（业务 → 模块：登记定义 · 提交 / 决定审批 · 开单 / 发事件 · 查待办；工单 → 工作流：起实例 · 建任务 · 发事件）　虚线：回调与事件，业务必须幂等</text>
<text x="56" y="876" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">解耦：两个模块都只认「业务对象引用 + 属性 + 锚点」；业务只提供 操作人上下文 · 数据范围条件 · 锚点。只要审批的业务只接 ④；只要状态机的只依赖 workflow-api。</text>
