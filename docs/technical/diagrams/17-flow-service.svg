<text x="56" y="844" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实线：调用（业务 → 服务：登记定义 · 提交 / 决定审批 · 开单 / 发事件 · 查待办）　虚线：回调与事件（审批结果 · 工单迁移，业务必须幂等）</text>
<text x="56" y="876" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">解耦：服务只认「业务对象引用 + 属性 + 锚点」；业务只提供 操作人上下文 · 数据范围条件 · 锚点。只要状态机的业务依赖 flow-api 即可，不必接服务。</text>
