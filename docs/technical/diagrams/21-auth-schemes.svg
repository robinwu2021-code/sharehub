<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A585B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7173"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="68" font-size="42" fill="#12181B" font-weight="750" text-anchor="start" letter-spacing="-1" opacity="1">两种认证方案：B 端与 C 端</text>
<text x="56" y="104" font-size="22" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">同一单体内两条过滤器链 · 按身份域分凭据池 · 共用令牌存储　｜　代码：common/auth · platform/iam · user/consumer</text>
<line x1="56" y1="126" x2="1544" y2="126" stroke="#D8E0DF" stroke-width="2"/>
<rect x="56" y="146" width="732.0" height="648" rx="10" fill="#EEF2F8"/>
<rect x="56" y="146" width="6" height="648" rx="3" fill="#5B7BA6"/>
<text x="78" y="176" font-size="21" fill="#5B7BA6" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">B 端认证 · 运营台与商家视图</text>
<text x="80" y="214" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">身份域</text>
<text x="216" y="214" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">STAFF 员工 · AGENT 商家</text>
<text x="80" y="264" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录方式</text>
<text x="216" y="264" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">员工：账号 + 密码　商家：手机 + 验证码</text>
<text x="80" y="314" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录接口</text>
<text x="216" y="314" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">POST /api/auth/login · /api/auth/otp</text>
<text x="80" y="364" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">令牌</text>
<text x="216" y="364" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不透明令牌：员工 stk_ · 商家 atk_</text>
<text x="80" y="414" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">过滤器链</text>
<text x="216" y="414" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">/api/** → StaffTokenAuthFilter</text>
<text x="80" y="464" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">授权</text>
<text x="216" y="464" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RBAC 权限码（@perm.can）</text>
<text x="216" y="489" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">+ 数据范围：全部 / 区域 / 站点 / 点位 / 场地 / 商家 / 本人</text>
<text x="80" y="539" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">菜单</text>
<text x="216" y="539" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">后端下发菜单与权限码；改权限即时生效</text>
<text x="80" y="589" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">多主体</text>
<text x="216" y="589" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一个账号可属多个商家，登录后切换</text>
<text x="80" y="639" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">匿名放行</text>
<text x="216" y="639" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录 · 验证码 · 商家入驻申请</text>
<rect x="812.0" y="146" width="732.0" height="648" rx="10" fill="#F2EDF7"/>
<rect x="812.0" y="146" width="6" height="648" rx="3" fill="#7D63A3"/>
<text x="834.0" y="176" font-size="21" fill="#7D63A3" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">C 端认证 · App / 小程序 / H5</text>
<text x="836.0" y="214" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">身份域</text>
<text x="972.0" y="214" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">CONSUMER 消费者</text>
<text x="836.0" y="264" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录方式</text>
<text x="972.0" y="264" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">手机验证码 · 密码 · Apple · Google</text>
<text x="972.0" y="289" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">微信小程序 · 微信公众号</text>
<text x="836.0" y="339" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录接口</text>
<text x="972.0" y="339" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">POST /mp/auth/login（按 grantType 分发）</text>
<text x="836.0" y="389" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">令牌</text>
<text x="972.0" y="389" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不透明令牌：ctk_</text>
<text x="836.0" y="439" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">过滤器链</text>
<text x="972.0" y="439" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">/mp/** → ConsumerTokenAuthFilter</text>
<text x="836.0" y="489" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">授权</text>
<text x="972.0" y="489" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">属主校验：只能访问本人的订单、</text>
<text x="972.0" y="514" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">钱包、发票（防越权）；无 RBAC</text>
<text x="836.0" y="564" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录开关</text>
<text x="972.0" y="564" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录方式按国家开关</text>
<text x="836.0" y="614" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">身份归并</text>
<text x="972.0" y="614" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">多种登录方式绑定同一消费者</text>
<text x="836.0" y="664" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">匿名放行</text>
<text x="972.0" y="664" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">登录 · 附近网点 · 站点 · 公告</text>
<rect x="56" y="808" width="1488" height="64" rx="10" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="80" y="838" font-size="19" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">共用：令牌存储 MySQL + 本地缓存（可选 Redis / 内存）· 令牌前缀与身份域不符直接 401 · 凭据按身份域分池</text>
<text x="80" y="864" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不属于用户认证：服务间调用（设备服务、支付、调度器、OpsKit 回调）另用内部凭证 X-Internal-Token</text>
</svg>