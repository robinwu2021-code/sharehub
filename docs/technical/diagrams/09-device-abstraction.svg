<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A585B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7173"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="68" font-size="42" fill="#12181B" font-weight="750" text-anchor="start" letter-spacing="-1" opacity="1">多设备类型与多供应商</text>
<text x="56" y="104" font-size="22" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">首批三类：充电宝 · 充电桩 · 储物柜　｜　按「变化的原因」分层，不按业务名词</text>
<line x1="56" y1="126" x2="1544" y2="126" stroke="#D8E0DF" stroke-width="2"/>
<rect x="56" y="150" width="1488" height="128" rx="10" fill="#EDF4EE"/>
<rect x="56" y="150" width="6" height="128" rx="3" fill="#5C8A63"/>
<text x="78" y="180" font-size="21" fill="#5C8A63" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">① 设备无关（新增设备类型完全不动）</text>
<rect x="76" y="196" width="278" height="62" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="215.0" y="223.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">站点·点位</text>
<text x="215.0" y="252.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">在哪</text>
<rect x="372" y="196" width="278" height="62" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="511.0" y="223.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">柜机=容器</text>
<text x="511.0" y="252.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">dev_cabinet</text>
<rect x="668" y="196" width="278" height="62" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="807.0" y="223.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">槽位=货位</text>
<text x="807.0" y="252.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">dev_slot</text>
<rect x="964" y="196" width="278" height="62" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="1103.0" y="223.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">告警·工单·库存</text>
<text x="1103.0" y="252.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">怎么运转</text>
<rect x="1260" y="196" width="278" height="62" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="1399.0" y="223.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">代理·分润·结算·发票</text>
<text x="1399.0" y="252.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">钱怎么走</text>
<rect x="56" y="302" width="1488" height="168" rx="10" fill="#F9EEEF"/>
<rect x="56" y="302" width="6" height="168" rx="3" fill="#A35D63"/>
<text x="78" y="332" font-size="21" fill="#A35D63" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">② 订单：共性主表 + 类型扩展表（判据：资金侧只认主表）</text>
<rect x="76" y="348" width="560" height="62" rx="9" fill="#FFFFFF" stroke="#A35D63" stroke-width="3"/>
<text x="356.0" y="375.0" font-size="27" fill="#12181B" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">ord_order</text>
<text x="356.0" y="404.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">order_no · device_type · 用户 · 站点 · 状态 · 金额 · 时间</text>
<rect x="676" y="348" width="420" height="62" rx="9" fill="#FFFFFF" stroke="#A35D63" stroke-width="1.8"/>
<text x="886.0" y="375.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">ord_rent_ext（充电宝）</text>
<text x="886.0" y="404.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">powerbank_no · 归还柜 · 押金 · 买断 · 时长</text>
<rect x="1116" y="348" width="420" height="62" rx="9" fill="#FFFFFF" stroke="#A35D63" stroke-width="1.8"/>
<text x="1326.0" y="375.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">ord_charge_ext（充电桩）</text>
<text x="1326.0" y="404.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">枪号 · kWh · 起止 SOC · 峰值功率</text>
<text x="76" y="438" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">状态机共性骨架 CREATED→ACTIVE→ENDED→SETTLED→CLOSED；ACTIVE 对充电宝=已借出、对充电桩=充电中。</text>
<rect x="56" y="486" width="1488" height="168" rx="10" fill="#FBF3E8"/>
<rect x="56" y="486" width="6" height="168" rx="3" fill="#B07D3A"/>
<text x="78" y="516" font-size="21" fill="#B07D3A" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">③ 供应商：驱动插件，按设备类型分族（不是服务边界）</text>
<rect x="76" y="532" width="352" height="62" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="252.0" y="559.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">通用指令/事件</text>
<text x="252.0" y="588.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">REBOOT · ONLINE/OFFLINE · FAULT · OTA</text>
<rect x="444" y="532" width="352" height="62" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="620.0" y="559.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">充电宝族</text>
<text x="620.0" y="588.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">EJECT · SLOT_REPORT（各家私有协议）</text>
<rect x="812" y="532" width="352" height="62" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="988.0" y="559.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">充电桩族</text>
<text x="988.0" y="588.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">START/STOP · METER_VALUE（对齐 OCPP）</text>
<rect x="1180" y="532" width="356" height="62" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="1358.0" y="559.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">储物柜族（最小样本）</text>
<text x="1358.0" y="588.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">OPEN_CELL · CELL_OPENED · OVERTIME</text>
<text x="76" y="622" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">驱动声明 (deviceType, protocol)；平台按 柜机的 vendor_code + device_type 路由。gw_vendor 加 device_types 多值列。</text>
<rect x="56" y="670" width="1488" height="92" rx="10" fill="#EEF2F8"/>
<rect x="56" y="670" width="6" height="92" rx="3" fill="#5B7BA6"/>
<text x="78" y="700" font-size="21" fill="#5B7BA6" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">④ 两个接入面：南向已独立，北向先随 platform（伙伴&gt;3 再拆）</text>
<rect x="76" y="712" width="950" height="56" rx="9" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1.8"/>
<text x="551.0" y="736.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">南向 device-gateway（已定，第 5 个服务）</text>
<text x="551.0" y="765.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">我们控制设备 · OCPP/私有协议 · 每接一家改一次</text>
<rect x="1056" y="712" width="480" height="56" rx="9" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1.8"/>
<text x="1296.0" y="736.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">北向 互联互通（第 6 个的首选增长点）</text>
<text x="1296.0" y="765.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">伙伴调我们下单 · OCPI · 伙伴是结算对手方</text>
<text x="56" y="800" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">储物柜检验并修正了抽象一处：押金出现在 3 类中的 2 类 → 升格规则「字段现身 ≥2 类即升主表」，deposit 升入 ord_order。</text>
<text x="56" y="836" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">红线：供应商只做设备管理，订单/计价/支付/结算全在本平台 —— 厂商云的订单类 SaaS 一律不用；设备事件只是物理事实（EJECT_OK / ITEM_INSERTED），归还判定归 core。</text>
<text x="56" y="868" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">新增一种设备 = 一张扩展表 + 一个 device.&lt;type&gt; 模块 + 一族指令事件 + 一个驱动。资金/场地/代理/工单四域完全不动。</text>
</svg>