<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A585B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7173"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="68" font-size="42" fill="#12181B" font-weight="750" text-anchor="start" letter-spacing="-1" opacity="1">合理微服务：现在拆什么，将来按信号拆什么</text>
<text x="56" y="104" font-size="22" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按变化的原因拆，不按业务名词拆 · 一套代码两种部署（ADR-017）· 上限 7 个业务服务</text>
<line x1="56" y1="126" x2="1544" y2="126" stroke="#D8E0DF" stroke-width="2"/>
<rect x="56" y="146" width="448" height="66" rx="9" fill="#FFFFFF" stroke="#A35D63" stroke-width="3"/>
<text x="280.0" y="177.68" font-size="25" fill="#12181B" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">第一阶段（现在）</text>
<text x="280.0" y="198" font-size="16" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">自有 2 个进程 + 共用 2 个服务</text>
<rect x="576" y="146" width="448" height="66" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="3"/>
<text x="800.0" y="177.68" font-size="25" fill="#12181B" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">信号出现后（按需逐个拆）</text>
<text x="800.0" y="198" font-size="16" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">从单体里拆出，代码不改</text>
<rect x="1096" y="146" width="448" height="66" rx="9" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="3"/>
<text x="1320.0" y="177.68" font-size="25" fill="#12181B" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">上限（7 个业务服务）</text>
<text x="1320.0" y="198" font-size="16" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">超过须先回答「哪两个变化原因不同」</text>
<rect x="56" y="228" width="448" height="250" rx="10" fill="#FFFFFF" stroke="#A35D63" stroke-width="3"/>
<text x="76" y="262" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">业务大单体 sharehub-app</text>
<text x="76" y="294" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">平台 · 交易 · 财务 · 运维 · 报表</text>
<text x="76" y="324" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">集成适配（OpsKit · 会计预留）</text>
<text x="76" y="354" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">B 端 / C 端 API 与两套认证</text>
<text x="76" y="384" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">理由：借还要本地事务；单运营方、</text>
<text x="76" y="414" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">未规模化，拆开只多运维成本</text>
<rect x="56" y="494" width="448" height="110" rx="10" fill="#FFFFFF" stroke="#B07D3A" stroke-width="3"/>
<text x="76" y="528" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">设备对接服务（独立）</text>
<text x="76" y="560" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每接一家厂商变一次 · 长连接技术栈</text>
<text x="76" y="588" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">故障不拖累交易（ADR-018）</text>
<rect x="56" y="620" width="448" height="92" rx="10" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="76" y="654" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">支付 · 任务调度（共用 ai-shop）</text>
<text x="76" y="686" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">代码与实例共用，按 system 隔离（ADR-025）</text>
<rect x="576" y="228" width="448" height="110" rx="10" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="596" y="262" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">1 · 集成服务</text>
<text x="596" y="294" font-size="18" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">信号：接入 Zoho 等外部 SaaS 时</text>
<text x="596" y="322" font-size="17" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">限流、超时、凭据轮换不拖累交易</text>
<rect x="576" y="352" width="448" height="110" rx="10" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="596" y="386" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">2 · 报表服务</text>
<text x="596" y="418" font-size="18" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">信号：报表 / 导出拖慢交易库时</text>
<text x="596" y="446" font-size="17" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读模型独立，可接只读副本</text>
<rect x="576" y="476" width="448" height="110" rx="10" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="596" y="510" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">3 · 财务服务</text>
<text x="596" y="542" font-size="18" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">信号：合规要求财务独立部署时</text>
<text x="596" y="570" font-size="17" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">或批处理窗口与交易高峰冲突</text>
<rect x="576" y="600" width="448" height="110" rx="10" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="596" y="634" font-size="23" fill="#12181B" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">4 · 运维服务</text>
<text x="596" y="666" font-size="18" fill="#12181B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">信号：告警事件量需独立扩容时</text>
<text x="596" y="694" font-size="17" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">处置节奏本就与主链路无关</text>
<rect x="1096" y="228" width="448" height="484" rx="10" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="3"/>
<text x="1120" y="268" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">1  平台</text>
<text x="1524" y="268" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">不预期拆 · 运营配置面</text>
<line x1="1116" y1="288" x2="1524" y2="288" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="326" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">2  交易</text>
<text x="1524" y="326" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">不拆 · 借还主链路要本地事务</text>
<line x1="1116" y1="346" x2="1524" y2="346" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="384" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">3  财务</text>
<text x="1524" y="384" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">信号 3</text>
<line x1="1116" y1="404" x2="1524" y2="404" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="442" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">4  运维</text>
<text x="1524" y="442" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">信号 4</text>
<line x1="1116" y1="462" x2="1524" y2="462" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="500" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">5  报表</text>
<text x="1524" y="500" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">信号 2</text>
<line x1="1116" y1="520" x2="1524" y2="520" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="558" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">6  集成</text>
<text x="1524" y="558" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">信号 1</text>
<line x1="1116" y1="578" x2="1524" y2="578" stroke="#D8E0DF" stroke-width="1"/>
<text x="1120" y="616" font-size="22" fill="#12181B" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">7  设备对接</text>
<text x="1524" y="616" font-size="18" fill="#7C8B8E" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">已独立</text>
<text x="1120" y="688" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">+ 共用：支付 · 任务调度</text>
<line x1="512" y1="400" x2="566" y2="400" stroke="#0F7173" stroke-width="2.6" marker-end="url(#ao)"/>
<line x1="1032" y1="400" x2="1086" y2="400" stroke="#0F7173" stroke-width="2.6" marker-end="url(#ao)"/>
<rect x="56" y="730" width="1488" height="140" rx="10" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="80" y="764" font-size="21" fill="#5C8A63" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">拆分前必须先就绪（缺一不拆）</text>
<rect x="80" y="782" width="259.19999999999993" height="34" rx="17" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.6"/>
<text x="209.59999999999997" y="804" font-size="17" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">跨进程链路追踪 traceparent</text>
<rect x="349.19999999999993" y="782" width="274.5" height="34" rx="17" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.6"/>
<text x="486.44999999999993" y="804" font-size="17" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">Outbox 跨进程投递 + 消费去重</text>
<rect x="633.6999999999999" y="782" width="130.0" height="34" rx="17" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.6"/>
<text x="698.6999999999999" y="804" font-size="17" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">会话存储入库</text>
<rect x="773.6999999999999" y="782" width="396.9" height="34" rx="17" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.6"/>
<text x="972.1499999999999" y="804" font-size="17" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">边界卡口进 CI（跨模块 JOIN / 事务 / 注入）</text>
<text x="80" y="852" font-size="18" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">拆分动作 = 换打包方式：模块只经 sharehub-api 契约与事件交互，classpath 决定走本地还是远程实现。</text>
</svg>