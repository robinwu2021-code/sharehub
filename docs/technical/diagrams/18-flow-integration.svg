<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',-apple-system,'Segoe UI',Roboto,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A585B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7173"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="68" font-size="42" fill="#12181B" font-weight="750" text-anchor="start" letter-spacing="-1" opacity="1">业务系统怎样接入 flow</text>
<text x="56" y="104" font-size="22" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">启动登记 · 审批 · 工单三段　｜　虚线为回调与事件　｜　业务一律经 flow-client，不直连服务</text>
<line x1="56" y1="126" x2="1544" y2="126" stroke="#D8E0DF" stroke-width="2"/>
<rect x="145.0" y="150" width="230" height="54" rx="9" fill="#FFFFFF" stroke="#7D63A3" stroke-width="1.8"/>
<text x="260.0" y="186.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">审批人 / 受理方</text>
<line x1="260.0" y1="208" x2="260.0" y2="800" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="415.0" y="150" width="230" height="54" rx="9" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1.8"/>
<text x="530.0" y="186.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">业务系统</text>
<line x1="530.0" y1="208" x2="530.0" y2="800" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="685.0" y="150" width="230" height="54" rx="9" fill="#FFFFFF" stroke="#5C8A63" stroke-width="1.8"/>
<text x="800.0" y="186.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">flow-client</text>
<line x1="800.0" y1="208" x2="800.0" y2="800" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="955.0" y="150" width="230" height="54" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="3"/>
<text x="1070.0" y="186.0" font-size="27" fill="#12181B" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">flow 服务</text>
<line x1="1070.0" y1="208" x2="1070.0" y2="800" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="1225.0" y="150" width="230" height="54" rx="9" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="1340.0" y="186.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">任务服务</text>
<line x1="1340.0" y1="208" x2="1340.0" y2="800" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="56" y1="234" x2="1544" y2="234" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="8 8"/>
<text x="64" y="226" font-size="21" fill="#7C8B8E" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">启动</text>
<line x1="56" y1="322" x2="1544" y2="322" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="8 8"/>
<text x="64" y="314" font-size="21" fill="#7C8B8E" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">审批</text>
<line x1="56" y1="620" x2="1544" y2="620" stroke="#D8E0DF" stroke-width="2" stroke-dasharray="8 8"/>
<text x="64" y="612" font-size="21" fill="#7C8B8E" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">工单</text>
<line x1="536.0" y1="266" x2="790.0" y2="266" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="663.0" y="254.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">① 声明定义（代码）</text>
<line x1="806.0" y1="304" x2="1060.0" y2="304" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="933.0" y="292.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">② 登记定义 · 带版本</text>
<line x1="536.0" y1="356" x2="790.0" y2="356" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="663.0" y="344.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">③ 提交：对象 + 属性 + 锚点</text>
<line x1="806.0" y1="396" x2="1060.0" y2="396" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="933.0" y="384.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">④ + 操作人上下文 · 幂等键</text>
<line x1="1064.0" y1="436" x2="270.0" y2="436" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="667.0" y="424.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑤ 生成任务 → 进入待办</text>
<line x1="266.0" y1="476" x2="520.0" y2="476" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="393.0" y="464.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑥ 在待办里决定</text>
<line x1="536.0" y1="516" x2="1060.0" y2="516" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="798.0" y="504.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑦ 决定（经 flow-client）</text>
<line x1="1064.0" y1="556" x2="810.0" y2="556" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="937.0" y="544.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑧ 结果回调</text>
<line x1="794.0" y1="596" x2="540.0" y2="596" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="667.0" y="584.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑨ 幂等 → 推进业务状态</text>
<line x1="536.0" y1="654" x2="1060.0" y2="654" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="798.0" y="642.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑩ 去重开单 · 发事件（经 flow-client）</text>
<line x1="1064.0" y1="694" x2="270.0" y2="694" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="667.0" y="682.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑪ 派单 / 进抢单池 → 待办</text>
<line x1="1334.0" y1="734" x2="1080.0" y2="734" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)"/>
<text x="1207.0" y="722.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑫ 定时扫 SLA</text>
<line x1="1064.0" y1="774" x2="540.0" y2="774" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="802.0" y="762.0" font-size="18" fill="#4A585B" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">⑬ 迁移回调 · 超时事件</text>
<text x="56" y="840" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">形态 A：服务嵌在业务进程，⑧ ⑨ 与 ⑦ 同一事务、同步执行；形态 B：⑧ ⑬ 走 HTTP，失败重试，flow-client 定期对账补推。</text>
<text x="56" y="872" font-size="19" fill="#4A585B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">业务只提供三样：操作人上下文（④ ⑦）· 数据范围条件（查待办时）· 锚点（③ ⑩）；回调必须幂等，且不回头调服务。</text>
</svg>