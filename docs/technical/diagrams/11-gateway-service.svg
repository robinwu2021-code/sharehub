<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="68" font-size="42" fill="#12181B" font-weight="750" text-anchor="start" letter-spacing="-1" opacity="1">协议对接服务 sharehub-gateway</text>
<text x="56" y="104" font-size="22" fill="#7C8B8E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">对接第三方充电宝 · 充电桩平台与设备　｜　逻辑上一个服务：可以是 1 个进程 / 插件化 / 多进程</text>
<line x1="56" y1="126" x2="1544" y2="126" stroke="#D8E0DF" stroke-width="2"/>
<rect x="56" y="148" width="1488" height="100" rx="10" fill="#F0F3F3"/>
