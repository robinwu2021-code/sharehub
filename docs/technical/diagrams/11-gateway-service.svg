<text x="78" y="178" font-size="21" fill="#6B7A7C" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">① 对端（三种接入形态）</text>
<rect x="76.0" y="182" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="251.0" y="208.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">A 厂商云</text>
<text x="251.0" y="237.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">HTTPS API + Webhook 回调</text>
<rect x="442.0" y="182" width="716.0" height="60" rx="9" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="800.0" y="208.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">B 设备直连</text>
<text x="800.0" y="237.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">TCP 私有协议 · MQTT（经 EMQX）</text>
<rect x="1174.0" y="182" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#6B7A7C" stroke-width="1.8"/>
<text x="1349.0" y="208.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">C 行业标准</text>
<text x="1349.0" y="237.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">OCPP 1.6J / 2.0.1（WebSocket）</text>
