<rect x="56" y="266" width="6" height="100" rx="3" fill="#B07D3A"/>
<text x="78" y="296" font-size="21" fill="#B07D3A" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">② 传输适配 transport（按协议一个，互不依赖）</text>
<rect x="76.0" y="300" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="251.0" y="326.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">http-webhook</text>
<text x="251.0" y="355.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">/gw/callback/{vendor} · 验签</text>
<rect x="442.0" y="300" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="617.0" y="326.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">tcp-netty</text>
<text x="617.0" y="355.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">长连接会话 · 帧编解码</text>
<rect x="808.0" y="300" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="983.0" y="326.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">mqtt</text>
<text x="983.0" y="355.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">订阅上行 · 发布指令</text>
<rect x="1174.0" y="300" width="350.0" height="60" rx="9" fill="#FFFFFF" stroke="#B07D3A" stroke-width="1.8"/>
<text x="1349.0" y="326.0" font-size="27" fill="#12181B" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">ocpp-ws</text>
<text x="1349.0" y="355.0" font-size="19" fill="#7C8B8E" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">/ocpp/{chargePointId}</text>
<line x1="239.0" y1="362" x2="239.0" y2="382" stroke="#0F7173" stroke-width="2.6" marker-end="url(#ao)"/>
<line x1="263.0" y1="382" x2="263.0" y2="362" stroke="#4A585B" stroke-width="2.6" marker-end="url(#a)" stroke-dasharray="6 5"/>
