spring:
  application:
    name: opskit
  jackson:
    # 可选字段缺省时不输出（21/06 §七 的「?」字段）；空数组照常输出
    default-property-inclusion: non_null

server:
  port: ${OPSKIT_PORT:8090}

opskit:
  crypto:
    # 32 字节密钥的 Base64（如 openssl rand -base64 32）。只经环境变量 / 密钥管理注入，不进仓库；缺了拒绝启动
    key: ${OPSKIT_CRYPTO_KEY:}
  outbox:
    relay-interval: 5s
    # 已送达事件（连同投递记录）保留期，每日 03:45 UTC 清理；失败待人工的不清（信封里可能有外部确认令牌明文，不宜无限期留存）
    retention: ${OPSKIT_OUTBOX_RETENTION:30d}
  idempotency:
    retention: 7d

# 21/02 §九 · 21/05 §七：两项都已由 DbSchedulerTimerSchedulerTest 实测
db-scheduler:
  table-name: plat_scheduled_tasks
  # MySQL 系的 DATETIME 不带时区；不开这项，执行时刻按 JVM 时区存，换时区部署就错位（默认 false）
  always-persist-timestamp-in-utc: true
  # 等平台迁移建好 plat_scheduled_tasks 再启动轮询（默认 false）
  delay-startup-until-context-ready: true
  threads: 10
  polling-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always

# 日志（21/07 O4-3）：每行带 traceId / workspace / actor。设了 OPSKIT_LOG_DIR 才落盘（{dir}/spring.log，按天滚动保留 20 天）；不设只打控制台（systemd 下进 journal）
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] [ws=%X{workspace:-}] [actor=%X{actor:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] [ws=%X{workspace:-}] [actor=%X{actor:-}] %logger{36} - %msg%n"
  file:
    path: ${OPSKIT_LOG_DIR:}
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 200MB
      max-history: 20
      total-size-cap: 10GB
