# 让**所有**测试都走 test profile（B2 · TDD-test-db-isolation）。
#
# 为什么放这里而不是给 25 个测试类逐个加 @ActiveProfiles("test")：
# 漏加一个，那个测试就会连上开发库 —— 而且不会报错，只是数据写错了地方，
# 几天后才以"别人的测试莫名其妙失败"的形式出现。一处生效，将来新增的测试自动覆盖。
#
# 为什么是 application.properties 而不是 application.yml：
# 测试资源里的 application.yml 会**整体遮蔽**主模块的 application.yml（同名文件，classpath 靠前者胜），
# 那等于把主配置全丢了。properties 与 yml 会**同时加载**，所以这里只声明 profile，
# 其余覆盖写在 application-test.yml 里，按 profile 叠加。
spring.profiles.active=test

# 测试库 test_sharehub 由 `powerbank` 账号自建（MariaDB 默认给 PUBLIC 授了 test_% 通配权限），
# **不需要 root**。迁移在测试库上原样跑，所以第一次运行会慢一些（43+ 个迁移建 150 张表）。
#
# 换库名：设 SHAREHUB_TEST_DB，且**仍要以 test_ 开头**，否则又回到要 root 的境地。

# 测试日志写进 target/，随 mvn clean 清掉，不污染工作区
sharehub.log.dir=target/logs
