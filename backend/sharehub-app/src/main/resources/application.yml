server:
  port: 8080

spring:
  application:
    name: sharehub-app
  # 文件上传经应用服务器（2026-09-25 定）：单文件上限 20MB（各用途在业务层再收紧），请求体 25MB；nginx 为 30MB。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 1MB
  # 引 neargo-common-security 只为其 rbac(@perm)；关掉它的其它 auto-config（sharehub 自持会话/租户/链）。
  autoconfigure:
    exclude:
      - ai.neargo.common.security.SecurityAutoConfiguration
      - ai.neargo.common.security.SessionStoreAutoConfiguration
      - ai.neargo.common.data.DataAutoConfiguration
  # P4：场所域(loc_)持久化到 MariaDB(pb_core)。其余域仍走内存种子（渐进替换）。
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pb_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${PB_DB_USER:powerbank}
    password: ${PB_DB_PASS:powerbank}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # C 端 usr_user/usr_identity 表自建（幂等 CREATE IF NOT EXISTS，见 resources/schema.sql）。
  # 建表交给 Flyway（db/migration/V1..V10，131 张表）。
  # 关掉 spring.sql.init：它每次启动重跑、无版本记录，且 continue-on-error:true 会把真错误一起吞掉
  # —— 之前「表不存在」的问题反复出现，正是因为它只建了 resources/schema.sql 里那 8 张。
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 开发库已存在 17 张表（非 Flyway 建的）→ baseline 后把 V1..V10 全部作为「待应用」执行。
    # 脚本已幂等化（CREATE TABLE / ADD COLUMN / ADD KEY 均带 IF NOT EXISTS，MariaDB 支持），
    # 因此对已有表与已有列是安全的空操作，不会丢数据。
    baseline-on-migrate: true
    baseline-version: 0
    # 允许迁移与已应用记录的校验和不一致时报错（默认即 true），改动历史脚本会被挡下 —— 这是想要的
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 骨架：其余域零基础设施（内存种子直出）。真域落地再引 data/security/tenant。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false   # 关 redis 健康检查（token-store!=redis 时无 Redis，避免 readiness DOWN）

# 开发期 CORS 允许源（ops-web Next dev）。生产走同源 nginx 反代 /api，无需 CORS。
sharehub:
  # 文件存储（方案-文件上传与COS存储）：生产 cos，测试 / 离线开发 local。
  # type=cos 时桶名与密钥任一为空 → 启动失败（CosFileStorage#selfCheck）。密钥只走环境变量。
  storage:
    type: ${SHAREHUB_STORAGE_TYPE:local}
    presign-ttl: PT5M
    local:
      root: ${SHAREHUB_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/sharehub-files}
      sign-secret: ${SHAREHUB_STORAGE_LOCAL_SIGN_SECRET:dev-only-local-file-sign}
    cos:
      region: ${SHAREHUB_COS_REGION:}
      secret-id: ${SHAREHUB_COS_SECRET_ID:}
      secret-key: ${SHAREHUB_COS_SECRET_KEY:}
      bucket-private: ${SHAREHUB_COS_BUCKET_PRIVATE:}
      bucket-pii: ${SHAREHUB_COS_BUCKET_PII:}
      bucket-public: ${SHAREHUB_COS_BUCKET_PUBLIC:}
  security:
    # 登录标识哈希的 pepper（ADR-030 §2.3）。**不配则启动失败** —— 手机号取值空间小到
    # 可以穷举，裸哈希等于明文存储。至少 32 字符。
    # ⚠️ 换 pepper = 全表 hash 失效，轮换必须走 *_enc 全表重算后统一切 hash_ver。
    identity-pepper: ${SHAREHUB_IDENTITY_PEPPER:}
    identity-pepper-version: ${SHAREHUB_IDENTITY_PEPPER_VERSION:1}
    # 本地号补哪个国际区号。**与 pepper 同级：上线后不可改**，改了等于所有本地号
    # 算出另一个 hash（注册能成、登录查不到）。971=AE
    default-calling-code: ${SHAREHUB_DEFAULT_CALLING_CODE:971}
  # 开发便利总开关：固定验证码 000000 + OTP 明文回传 + 免密登录运营端。
  # **默认关，生产绝不可开**（开启时启动日志会打 WARN 横幅）。
  # 2026-09-23 之前这三件事在所有环境无条件生效 —— 线上任何人可登录任意手机号。
  dev-mode:
    enabled: false
  # 演示种子数据：开发/演示环境开，**生产必须关**。
  # 2026-09-23 修正：注释一直写「默认即关」，值却是 true —— 空库启动即灌演示数据。
  # 之前 5 个 Seeder 无任何门禁，任何空库启动都会灌入 12 个假代理商 / 20 个假站点，
  # 且因幂等（有数据即跳过）灌入后不会被覆盖也不会提示 —— 生产上线即事故。
  seed:
    enabled: false
  cors:
    allowed-origins: http://localhost:3000
  # 跨进程地基（B7 · TDD-cross-process-foundation）
  services:
    # 服务凭证共享密钥。**空 = 内部调用与 /internal/** 端点一律拒绝**（fail-closed）。
    # 生产从环境变量注入，不写进仓库。
    internal-token: ${SHAREHUB_INTERNAL_TOKEN:}
    # 服务名 → 基址。走内网不经 nginx；单体形态下 GATEWAY 内嵌本进程，故留空。
    targets:
      SHAREHUB: ${SHAREHUB_TARGET_SHAREHUB:}
      GATEWAY: ${SHAREHUB_TARGET_GATEWAY:}
  outbox:
    dispatch:
      # 进程内轮询重投：**临时方案**，H4 接入共用调度器后关掉并删掉 OutboxDispatchScheduler。
      # 默认关 —— 多副本下会重复投递（消费端 EventIdempotency 兜底）。
      enabled: ${SHAREHUB_OUTBOX_DISPATCH_ENABLED:false}
      interval: 30s
      batch-size: 200
      max-attempts: 6
  # 可切换会话存储：memory(默认) | ehcache(单节点TTL) | redis(多实例推荐) | mysql(强持久sys_token)
  # 日志落盘（logback-spring.xml 读这几个键）。
  # 保留 20 天、5 天后压缩 —— 压缩由 deploy/tencent/cron/powerbank-log-compress 做，
  # 不是 logback 的职责（见 logback-spring.xml 顶部「切分与压缩的分工」）。
  log:
    # 默认相对路径 —— 绝对路径只在部署环境经 SHAREHUB_LOG_DIR 注入。
    # 理由见 logback-spring.xml 里 LOG_DIR 的注释。
    dir: ${SHAREHUB_LOG_DIR:logs}
    keep-days: ${SHAREHUB_LOG_KEEP_DAYS:20}
    max-file-size: ${SHAREHUB_LOG_MAX_FILE:200MB}
    # 容量上限管的是**异常情况**：一次异常风暴能几小时写满磁盘，而磁盘满会让数据库一起停。
    # 保留天数管正常情况，两者都要。
    total-size-cap: ${SHAREHUB_LOG_TOTAL_CAP:10GB}

  auth:
    # 令牌存储。四选一，随时可切，业务代码不感知（都走 TokenStore 接口）：
    #   mysql+ehcache  缺省 —— MySQL 持久 + 本地热层。会话活过重启，又不必每个请求查一次库
    #   mysql          纯持久，每次鉴权一次查库。正确但热路径上多一次 IO
    #   ehcache        纯本地，重启即掉线、多副本各记各的
    #   memory         **只给单测与本地起服**，语义同 ehcache
    #   redis          多副本/将来水平扩展时切这个；换法见 TokenStoreConfig 的注释（改一行）
    #
    # 2026-09-24 缺省从 memory 改为 mysql+ehcache ——「默认给一个重启就掉全部登录态的实现」
    # 是个只会在生产上暴露的默认值。
    token-store: ${SHAREHUB_TOKEN_STORE:mysql+ehcache}
    token-ttl: 2h
    # 热层 TTL，**与 token-ttl 是两回事，别配成一样**：
    # 前者是「最多容忍多久看不见别处的吊销」，后者是「会话本身多久过期」。
    # 主动吊销（登出/改权限）不受它影响 —— CachedTokenStore 会立刻清本地。
    # 多副本部署时它就是跨副本吊销延迟的上界；配 0 = 直通不缓存。
    token-cache-ttl: ${SHAREHUB_TOKEN_CACHE_TTL:30s}
    # 手机验证码（内存实现，落库见 A3）
    otp:
      ttl: 5m                 # 有效期
      resend-interval: 60s    # 同手机号重发间隔
      max-attempts: 5         # 单个码最多校验次数，超过即作废（防 6 位码被枚举）
